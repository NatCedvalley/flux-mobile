<ion-header>
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-label>Theme</ion-label>
      <ion-note slot="end">System</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Environment</ion-label>
      <ion-note slot="end">{{ environmentName }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>App version</ion-label>
      <ion-note slot="end">{{ appVersion }} ({{ commit }})</ion-note>
    </ion-item>
  </ion-list>
</ion-content>
