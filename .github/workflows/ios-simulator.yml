name: iOS simulator

on:
  pull_request:
    paths:
      - ios/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - scripts/ci/**
      - .github/workflows/ios-simulator.yml
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@12.0.2

      - run: npm ci

      # The dev build points sign-in at localhost:9001 and the task API at
      # localhost:9003, where the mocks below answer; the Debug app allows
      # local HTTP (CLAUDE.md §5).
      - run: npm run build:dev

      - run: npx cap sync ios

      # fb-idb drives the simulator's UI for the swipe-back check (it breaks
      # on Python 3.12+'s asyncio, hence 3.11); Pillow compares screenshots.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install idb
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          python -m pip install fb-idb pillow

      - name: Start mock IAM
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          node scripts/ci/mock-iam.mjs > "$RUNNER_TEMP/artifacts/mock-iam.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:9001/api/v1/accounts/me && exit 0
            sleep 0.5
          done
          echo "Mock IAM did not start"
          cat "$RUNNER_TEMP/artifacts/mock-iam.log"
          exit 1

      - name: Start mock flux-operations
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          node scripts/ci/mock-operations.mjs > "$RUNNER_TEMP/artifacts/mock-operations.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:9003/api/v1/dashboard/my-tasks && exit 0
            sleep 0.5
          done
          echo "Mock flux-operations did not start"
          cat "$RUNNER_TEMP/artifacts/mock-operations.log"
          exit 1

      - name: Show Xcode and scheme info
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      # Signed ad hoc ("Sign to Run Locally", no Apple account needed) rather
      # than unsigned: an unsigned app has no entitlements, so the simulator
      # refuses its Keychain writes and sign-in can't save the session.
      - name: Build for iOS simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- \
            build

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            ls -la "$RUNNER_TEMP/DerivedData/Build/Products" || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | .value[] | select(.name=="iPhone 17") | .udid' \
            | head -n1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone 17 simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch app
        run: |
          xcrun simctl install "$UDID" "$APP_PATH"

          LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" asia.justflux.mobile)
          echo "$LAUNCH_OUTPUT"
          PID=$(echo "$LAUNCH_OUTPUT" | sed -n 's/^asia\.justflux\.mobile: \([0-9][0-9]*\)$/\1/p')
          if [ -z "$PID" ]; then
            echo "Could not parse a PID from simctl launch output"
            exit 1
          fi
          echo "PID=$PID" >> "$GITHUB_ENV"

      - name: Confirm app is still running
        run: |
          sleep 20

          if ! ps -p "$PID" > /dev/null; then
            echo "App process $PID is not running"
            exit 1
          fi

          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:asia.justflux.mobile"; then
            echo "App not found running in the simulator's launchctl list"
            exit 1
          fi

          echo "App is running (pid $PID), confirmed via ps and launchctl"

      - name: Swipe back from task detail
        env:
          OUT_DIR: ${{ runner.temp }}/artifacts
          MOCK_IAM_LOG: ${{ runner.temp }}/artifacts/mock-iam.log
        run: scripts/ci/ios-swipe-back.sh

      - name: Take screenshot
        if: always() && env.UDID != ''
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/artifacts/flux-ios-simulator.png"

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-screenshot
          path: ${{ runner.temp }}/artifacts/*.png
          if-no-files-found: warn

      - name: Capture simulator app log
        if: failure() && env.UDID != ''
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "App"' \
            > "$RUNNER_TEMP/artifacts/app.log" 2>&1 || true

      - name: Upload simulator log artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-log
          path: |
            ${{ runner.temp }}/artifacts/app.log
            ${{ runner.temp }}/artifacts/mock-iam.log
            ${{ runner.temp }}/artifacts/mock-operations.log
          if-no-files-found: warn
