name: Android release

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options:
          - production
          - staging
        default: production

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    env:
      CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secrets in the android-release environment:$MISSING (see CLAUDE.md §9, Android signed build)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@12.0.2

      - run: npm ci

      - name: Build web app
        run: |
          if [ "$CONFIGURATION" = staging ]; then
            npm run build:staging
          else
            npm run build
          fi

      - run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$PACKAGE_VERSION (${{ github.run_number }})" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/flux-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          unset ANDROID_KEYSTORE_BASE64

          ./gradlew bundleRelease assembleRelease \
            -PfluxVersionCode="$VERSION_CODE" \
            -PfluxVersionName="$VERSION_NAME"

      - name: Verify signatures
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab

          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not found at $APK (an unsigned build is named app-release-unsigned.apk)"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB not found at $AAB"
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$CERTS"

          AAB_OUTPUT=$(jarsigner -verify "$AAB")
          echo "$AAB_OUTPUT"
          if ! echo "$AAB_OUTPUT" | grep -q "jar verified"; then
            echo "::error::AAB is not signed"
            exit 1
          fi

          {
            echo "### Android release"
            echo ""
            echo "- Configuration: \`$CONFIGURATION\`"
            echo "- versionName: \`$VERSION_NAME\`"
            echo "- versionCode: \`$VERSION_CODE\`"
            echo "- Signing certificate:"
            echo ""
            echo '```'
            echo "$CERTS" | grep "certificate SHA-256 digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p "$RUNNER_TEMP/artifacts"
          BASENAME="flux-$CONFIGURATION-$PACKAGE_VERSION-$VERSION_CODE"
          cp "$APK" "$RUNNER_TEMP/artifacts/$BASENAME.apk"
          cp "$AAB" "$RUNNER_TEMP/artifacts/$BASENAME.aab"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 30
