<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tasks"></ion-back-button>
    </ion-buttons>
    <ion-title>Task</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (task.isLoading()) {
    <div class="ion-text-center ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (task.value(); as t) {
    <ion-list>
      <ion-item>
        <ion-label>
          <h1>{{ t.title }}</h1>
          @if (t.description) {
            <p>{{ t.description }}</p>
          }
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Status</ion-label>
        <ion-label slot="end">{{ t.status }}</ion-label>
      </ion-item>
      @if (t.dueDate) {
        <ion-item>
          <ion-label>Due</ion-label>
          <ion-label slot="end">{{ t.dueDate | date }}</ion-label>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
