name: iOS release

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options:
          - production
          - staging
        default: production
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-release:
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-release
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      # Must match DEVELOPMENT_TEAM in the App target's Release config (project.pbxproj)
      APPLE_TEAM_ID: 44UNNHB3V6
    steps:
      - name: Check signing secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          MISSING=""
          for NAME in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64; do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secrets in the ios-release environment:$MISSING (see CLAUDE.md §9, iOS release)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@12.0.2

      - run: npm ci

      - name: Build web app
        run: |
          if [ "$CONFIGURATION" = staging ]; then
            npm run build:staging
          else
            npm run build
          fi

      - run: npx cap sync ios

      - name: Compute version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$PACKAGE_VERSION (${{ github.run_number }})" >> "$GITHUB_ENV"

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/flux-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/flux-distribution.p12"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$CERT"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE="$RUNNER_TEMP/flux.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          PROFILE_PLIST=$(security cms -D -i "$PROFILE")
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | plutil -extract UUID raw -o - -)
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | plutil -extract Name raw -o - -)
          if [ "$PROFILE_NAME" != "Flux App Store" ]; then
            echo "::error::Provisioning profile is named '$PROFILE_NAME', expected 'Flux App Store' (PROVISIONING_PROFILE_SPECIFIER in project.pbxproj)"
            exit 1
          fi
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$PROFILE_UUID.mobileprovision"
          done
          rm "$PROFILE"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Flux.xcarchive" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Flux.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify signature and version
        run: |
          IPA="$RUNNER_TEMP/export/App.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::error::IPA not found at $IPA"
            ls -la "$RUNNER_TEMP/export" || true
            exit 1
          fi

          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/App.app"

          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNING=$(codesign -dvv "$APP" 2>&1)
          echo "$SIGNING"
          AUTHORITY=$(echo "$SIGNING" | grep -m1 '^Authority=' | cut -d= -f2-)
          if ! echo "$AUTHORITY" | grep -q '^Apple Distribution'; then
            echo "::error::App is signed by '$AUTHORITY', expected an Apple Distribution certificate"
            exit 1
          fi
          if ! echo "$SIGNING" | grep -qx "TeamIdentifier=$APPLE_TEAM_ID"; then
            echo "::error::App is not signed for team $APPLE_TEAM_ID"
            exit 1
          fi

          ACTUAL_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")
          ACTUAL_BUILD=$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")
          if [ "$ACTUAL_VERSION" != "$PACKAGE_VERSION" ] || [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::App version is $ACTUAL_VERSION ($ACTUAL_BUILD), expected $VERSION_NAME"
            exit 1
          fi

          {
            echo "### iOS release"
            echo ""
            echo "- Configuration: \`$CONFIGURATION\`"
            echo "- CFBundleShortVersionString: \`$ACTUAL_VERSION\`"
            echo "- CFBundleVersion: \`$ACTUAL_BUILD\`"
            echo "- Signing identity: \`$AUTHORITY\`"
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p "$RUNNER_TEMP/artifacts"
          IPA_PATH="$RUNNER_TEMP/artifacts/flux-$CONFIGURATION-$PACKAGE_VERSION-$BUILD_NUMBER.ipa"
          cp "$IPA" "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

          echo "- TestFlight: uploaded, processing in App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys"
