name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@12.0.2

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm test -- --configuration=ci

      - run: npm run build

      # Playwright's own dev server and the CI mocks (playwright.config.ts):
      # the build above is production, with the real API URLs.
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
