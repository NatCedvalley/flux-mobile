<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/my-work"></ion-back-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (profile(); as profile) {
    <div class="profile">
      <span
        class="avatar"
        aria-hidden="true"
        [style.background]="profile.fill"
        >{{ profile.initials }}</span
      >
      <div class="profile-text">
        @if (profile.name) {
          <p class="name">{{ profile.name }}</p>
        }
        @if (profile.email) {
          <p class="email">{{ profile.email }}</p>
        }
        @if (profile.timezone) {
          <p class="timezone">{{ profile.timezone }}</p>
        }
      </div>
    </div>
  }
  <ion-list>
    <ion-item>
      <ion-label>Theme</ion-label>
      <ion-note slot="end">System</ion-note>
    </ion-item>
    @if (biometricsAvailable()) {
      <ion-item>
        <ion-toggle
          [checked]="biometricUnlock()"
          (ionChange)="setBiometricUnlock($event.detail.checked)"
          >Biometric unlock</ion-toggle
        >
      </ion-item>
    }
    <ion-item
      button
      routerLink="notifications"
    >
      <ion-label>Notifications</ion-label>
    </ion-item>
    <ion-item
      button
      routerLink="about"
    >
      <ion-label>About</ion-label>
    </ion-item>
    <ion-item
      button
      detail="false"
      [disabled]="loggingOut()"
      (click)="confirmLogout()"
    >
      <ion-label color="danger">Log out</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
