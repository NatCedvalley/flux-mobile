<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>View options</ion-title>
    <ion-buttons slot="end">
      <ion-button
        class="done"
        (click)="done.emit()"
        >Done</ion-button
      >
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <section class="group-by">
    <h2 id="view-group-by">Group by</h2>
    <div
      role="radiogroup"
      aria-labelledby="view-group-by"
    >
      <ion-list lines="full">
        @for (option of groupByOptions; track option.value) {
          <ion-item
            detail="false"
            [class.current]="option.value === groupBy()"
          >
            <button
              type="button"
              class="choice"
              role="radio"
              [attr.aria-checked]="option.value === groupBy()"
              (click)="groupByChange.emit(option.value)"
            >
              {{ option.label }}
              @if (option.value === groupBy()) {
                <ion-icon
                  class="current-mark"
                  name="circle-check"
                  aria-hidden="true"
                ></ion-icon>
              }
            </button>
          </ion-item>
        }
      </ion-list>
    </div>
  </section>

  <section class="sort">
    <h2 id="view-sort">Sort</h2>
    <div
      role="radiogroup"
      aria-labelledby="view-sort"
    >
      <ion-list lines="full">
        @for (option of sortOptions; track option.value) {
          <ion-item
            detail="false"
            [class.current]="option.value === sort()"
          >
            <button
              type="button"
              class="choice"
              role="radio"
              [attr.aria-checked]="option.value === sort()"
              (click)="sortChange.emit(option.value)"
            >
              {{ option.label }}
              @if (option.value === sort()) {
                <ion-icon
                  class="current-mark"
                  name="circle-check"
                  aria-hidden="true"
                ></ion-icon>
              }
            </button>
          </ion-item>
        }
      </ion-list>
    </div>
  </section>
</ion-content>
