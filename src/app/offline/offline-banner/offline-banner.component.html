@if (band(); as band) {
  @if (band.opens) {
    <button
      type="button"
      class="banner"
      aria-haspopup="dialog"
      (click)="open.set(true)"
    >
      <ion-icon
        [name]="band.icon"
        aria-hidden="true"
      ></ion-icon>
      <span class="text">{{ band.text }}</span>
      <ion-icon
        class="more"
        name="chevron-right"
        aria-hidden="true"
      ></ion-icon>
    </button>
  } @else {
    <div class="banner">
      <ion-icon
        [name]="band.icon"
        aria-hidden="true"
      ></ion-icon>
      <span class="text">{{ band.text }}</span>
    </div>
  }
}

<!-- Outside the band, which goes once nothing needs attention, so the sheet
     isn't destroyed while it shows the last changes. -->
<ion-modal
  class="flux-sheet flux-sheet-auto"
  aria-label="Pending changes"
  [isOpen]="open()"
  [breakpoints]="[0, 1]"
  [initialBreakpoint]="1"
  (didDismiss)="open.set(false)"
>
  <ng-template>
    <app-pending-changes-sheet (done)="open.set(false)" />
  </ng-template>
</ion-modal>
